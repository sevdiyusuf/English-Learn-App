name: Yunoo CI & PR Gating Pipeline

on:
  push:
    branches: [ main, master, 'agent/**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

env:
  FLUTTER_VERSION: '3.38.3'

jobs:
  flutter_quality:
    name: Flutter Quality &   
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Verify Formatting Freshness
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Static Code
        run: flutter analyze --no-fatal-infos

  generated_freshness:
    name: Generated Artifact Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Regenerate Educational Content Registry
        run: dart run tool/generate_educational_content_registry.dart

      - name: Run Build Runner Generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format .

      - name: Verify No Stale Artifacts or Uncommitted Diffs
        run: git diff --exit-code

  content_integrity:
    name: Educational Content & Provenance Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Run Sprint 10A Provenance Validator
        run: dart run tool/provenance_validator.dart

      - name: Run Sprint 10B Educational Content Validator
        run: dart run tool/educational_content_validator.dart

  flutter_tests:
    name: Flutter Full Test & Golden Baseline Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Run Complete Flutter Suite
        run: flutter test --reporter=compact

  functions_gate:
    name: Firebase Functions Build & Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI & Firestore Emulator
        run: |
          npm install -g firebase-tools
          firebase setup:emulators:firestore

      - name: Install Functions Dependencies (Reproducible)
        run: cd functions && npm ci

      - name: Build TypeScript Code
        run: cd functions && npm run build

      - name: Run Functions Test Suite under Firestore Emulator
        run: firebase emulators:exec --only firestore "cd functions && GCLOUD_PROJECT=demo-tamamm FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 npm test"

  firestore_rules:
    name: Firestore Security Rules Emulator Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI & Firestore Emulator
        run: |
          npm install -g firebase-tools
          firebase setup:emulators:firestore

      - name: Install Rules Test Dependencies (Reproducible)
        run: cd test_rules && npm ci

      - name: Run Firestore Rules Suite under Firestore Emulator
        run: firebase emulators:exec --only firestore "npx jest test_rules"

  android_build:
    name: Android Release Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Install NDK 29.0.13599879
        run: |
          yes | sdkmanager "ndk;29.0.13599879"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Build Release APK Artifact
        run: flutter build apk --release

      - name: Verify Build Artifact Output
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

  android_matrix:
    name: Android Device Smoke & Matrix (API ${{ matrix.api-level }})
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/

      - name: Install NDK 29.0.13599879
        run: |
          yes | sdkmanager "ndk;29.0.13599879"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Run Android Emulator P0 Integration Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: flutter test integration_test/p0_device_smoke_integration_test.dart

      - name: Build Release APK Artifact for Binary Inspection
        run: flutter build apk --release

      - name: Verify Android 16 KB Page-Size Compatibility
        run: dart run tool/verify_android_16kb_compatibility.dart
