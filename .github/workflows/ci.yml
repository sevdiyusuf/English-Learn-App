name: Yunoo CI & PR Gating Pipeline

on:
  push:
    branches: [ main, master, 'agent/**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  flutter_quality:
    name: Flutter Quality & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Verify Formatting Freshness
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Static Code
        run: flutter analyze --no-fatal-infos

  generated_freshness:
    name: Generated Artifact Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Regenerate Educational Content Registry
        run: dart run tool/generate_educational_content_registry.dart

      - name: Regenerate Code Generators (Freezed, JSON, Isar)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify No Stale Artifacts or Uncommitted Diffs
        run: git diff --exit-code assets/educational_content_registry.json lib/l10n/ lib/

  content_integrity:
    name: Educational Content & Provenance Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Run Sprint 10A Provenance Validator
        run: dart run tool/provenance_validator.dart

      - name: Run Sprint 10B Educational Content Validator
        run: dart run tool/educational_content_validator.dart

  flutter_tests:
    name: Flutter Full Test & Golden Baseline Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Complete Flutter Suite
        run: flutter test --reporter=compact

  functions_gate:
    name: Firebase Functions Build & Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Setup Java 21 (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Functions Dependencies
        run: npm --prefix functions ci || npm --prefix functions install

      - name: Build TypeScript Code
        run: npm --prefix functions run build

      - name: Run Functions Test Suite under Firestore Emulator
        run: npx firebase emulators:exec --only firestore "npm --prefix functions test"

  firestore_rules:
    name: Firestore Security Rules Emulator Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rules Test Dependencies
        run: npm --prefix test_rules ci || npm --prefix test_rules install

      - name: Run Firestore Rules Suite under Firestore Emulator
        run: npx firebase emulators:exec --only firestore "npx jest test_rules"

  android_build:
    name: Android Release Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK Artifact
        run: flutter build apk --release

      - name: Verify Build Artifact Output
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

  android_matrix:
    name: Android Device Smoke & Matrix (API ${{ matrix.api-level }})
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Android Emulator P0 Integration Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: flutter test integration_test/p0_device_smoke_integration_test.dart

      - name: Build Release APK Artifact for Binary Inspection
        run: flutter build apk --release

      - name: Verify Android 16 KB Page-Size Compatibility
        run: dart run tool/verify_android_16kb_compatibility.dart
